<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntentFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        /* Main Container */
        .popup-container {
            background: white;
            border-radius: 0;
            overflow: hidden;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: white;
            text-align: center;
            position: relative;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header h2::before {
            content: "💰";
            font-size: 24px;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #ef4444;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* Quick Add Section */
        .quick-add-section {
            padding: 20px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: "⚡";
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.2s;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .amount-input {
            position: relative;
        }

        .amount-input::before {
            content: "$";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 13px;
        }

        .amount-input input {
            padding-left: 28px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        /* Detected Data Section */
        .detected-section {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .detected-card {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
        }

        .detected-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .detected-label {
            color: #92400e;
            font-weight: 500;
        }

        .detected-value {
            color: #78350f;
            font-weight: 600;
            word-break: break-all;
            text-align: right;
            max-width: 60%;
        }

        /* Recent Transactions */
        .recent-section {
            padding: 16px 20px;
            background: #f9fafb;
            max-height: 280px;
            overflow-y: auto;
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recent-title {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recent-title::before {
            content: "📋";
        }

        .clear-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 11px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #e5e7eb;
            color: #ef4444;
        }

        .transaction-list {
            list-style: none;
        }

        .transaction-item {
            background: white;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            cursor: pointer;
        }

        .transaction-item:hover {
            transform: translateX(2px);
            border-color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-description {
            font-size: 13px;
            font-weight: 500;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .transaction-date {
            font-size: 10px;
            color: #9ca3af;
        }

        .transaction-amount {
            font-size: 14px;
            font-weight: 700;
            color: #10b981;
        }

        .transaction-amount.negative {
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
        }

        .empty-state::before {
            content: "💸";
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Footer */
        .footer {
            padding: 12px 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-link {
            font-size: 11px;
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: #667eea;
        }

        /* Scrollbar */
        .recent-section::-webkit-scrollbar {
            width: 6px;
        }

        .recent-section::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .recent-section::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .recent-section::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        /* Firefox scrollbar */
        @-moz-document url-prefix() {
            .recent-section {
                scrollbar-width: thin;
                scrollbar-color: #cbd5e1 #f1f1f1;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
        }

        .loading::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: "."; }
            40% { content: ".."; }
            60%, 100% { content: "..."; }
        }

        /* Success Animation */
        @keyframes checkmark {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="popup-container">
        <!-- Header -->
        <div class="header">
            <h2>IntentFlow</h2>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
        </div>

        <!-- Quick Add Section -->
        <div class="quick-add-section">
            <div class="section-title">Quick Add Transaction</div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" id="description" placeholder="e.g., Coffee, Groceries, Rent" autocomplete="off">
            </div>
            <div class="form-group">
                <label>Amount</label>
                <div class="amount-input">
                    <input type="number" id="amount" placeholder="0.00" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="">Select category...</option>
                    <option value="Groceries">🛒 Groceries</option>
                    <option value="Dining Out">🍽️ Dining Out</option>
                    <option value="Transportation">🚗 Transportation</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Bills">💡 Bills & Utilities</option>
                    <option value="Rent">🏠 Rent/Mortgage</option>
                    <option value="Health">🏥 Health</option>
                    <option value="Other">📦 Other</option>
                </select>
            </div>
            <div class="button-group">
                <button class="btn btn-secondary" id="detectBtn">🔍 Detect from Page</button>
                <button class="btn btn-primary" id="saveBtn">💾 Add Transaction</button>
            </div>
        </div>

        <!-- Detected Data Section -->
        <div class="detected-section" id="detectedSection" style="display: none;">
            <div class="section-title">Detected from Current Page</div>
            <div class="detected-card" id="detectedCard">
                <div class="detected-row">
                    <span class="detected-label">Amount:</span>
                    <span class="detected-value" id="detectedAmount">-</span>
                </div>
                <div class="detected-row">
                    <span class="detected-label">Description:</span>
                    <span class="detected-value" id="detectedDesc">-</span>
                </div>
                <div class="detected-row">
                    <span class="detected-label">Site:</span>
                    <span class="detected-value" id="detectedSite">-</span>
                </div>
                <button class="btn btn-secondary" id="useDetectedBtn" style="margin-top: 10px; width: 100%;">Use Detected Data</button>
            </div>
        </div>

        <!-- Recent Transactions -->
        <div class="recent-section">
            <div class="recent-header">
                <div class="recent-title">Recent Transactions</div>
                <button class="clear-btn" id="clearRecentBtn">Clear all</button>
            </div>
            <div id="transactionList">
                <div class="empty-state">No recent transactions</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <a href="#" class="footer-link" id="openSettings">⚙️ Settings</a>
            <a href="#" class="footer-link" id="openDashboard">📊 Dashboard</a>
            <span class="footer-link" id="version">v1.0.0</span>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
