# Plaid webhook relay — deploy from IntentFlow/:  fly deploy --config fly.plaid-relay.toml
# 1) fly apps create <app-name>   2) set `app` below to match   3) fly secrets set ...
app = "intentflow-plaid-relay"
primary_region = "iad"

[build]
  dockerfile = "deployment/plaid-relay/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  PLAID_ENV = "production"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpus = 1
  memory = "256mb"
  cpu_kind = "shared"
