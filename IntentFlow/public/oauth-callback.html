<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bank login — return to IntentFlow</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        max-width: 28rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
        line-height: 1.5;
        color: #0f172a;
      }
      h1 {
        font-size: 1.25rem;
      }
      p {
        color: #334155;
      }
    </style>
  </head>
  <body>
    <h1>Bank sign-in complete</h1>
    <p id="status">
      Returning you to <strong>IntentFlow</strong>…
    </p>
    <p id="hint" style="font-size: 0.875rem; color: #64748b"></p>
    <script>
      (function () {
        var q = window.location.search || '';
        var hint = document.getElementById('hint');
        var status = document.getElementById('status');

        if (q.indexOf('oauth_state_id=') === -1) {
          status.textContent = 'You can close this tab and return to IntentFlow.';
          return;
        }

        var deepLink = 'intentflow://plaid-oauth' + q;
        hint.textContent =
          'If IntentFlow does not open automatically, switch back to the app and retry Connect from Linked Banks.';

        try {
          window.location.href = deepLink;
        } catch (e) {}

        setTimeout(function () {
          if (window.opener) {
            try {
              window.close();
            } catch (e) {}
          }
        }, 2500);
      })();
    </script>
  </body>
</html>
